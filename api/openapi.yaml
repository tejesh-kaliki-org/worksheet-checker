          type: string
          format: uuid
    EvaluationPurpose:
      type: string
      description: Whether an Evaluation Attempt counts toward a Student's real grade
        (`scoring`) or exists only for offline comparison (`experiment`) -- see
        CONTEXT.md.
      enum:
        - scoring
        - experiment
    EvaluationAttemptStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
    Evaluation:
      type: object
      required:
        - id
        - evaluation_attempt_id
        - raw_score
        - marks
        - feedback
      properties:
        id:
          type: string
          format: uuid
        evaluation_attempt_id:
          type: string
          format: uuid
        raw_score:
          description: The AI's normalized judgment of correctness, 0.00-1.00.
          type: number
          format: double
        marks:
          description: raw_score x Question.Maximum Marks.
          type: number
          format: double
        feedback:
          description: Targeted, student-facing prose explaining the score.
          type: string
    EvaluationAttempt:
      type: object
      required:
        - id
        - answer_id
        - status
        - purpose
      properties:
        id:
          type: string
          format: uuid
        answer_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EvaluationAttemptStatus"
        purpose:
          $ref: "#/components/schemas/EvaluationPurpose"
        error:
          type: string
          nullable: true
        evaluation:
          allOf:
            - $ref: "#/components/schemas/Evaluation"
          nullable: true
    EvaluationAttemptList:
      type: object
