openapi: 3.0.3
info:
  title: Worksheet Checker API
  version: 0.1.0
tags:
  - name: auth
    x-displayName: auth
  - name: classes
    x-displayName: classes
  - name: evaluations
    x-displayName: evaluations
  - name: exams
    x-displayName: exams
  - name: health_other
    x-displayName: other
  - name: questions
    x-displayName: questions
  - name: students
    x-displayName: students
  - name: subjects
    x-displayName: subjects
  - name: submissions
    x-displayName: submissions
paths:
  /auth/signup:
    post:
      operationId: signup
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access + refresh pair (old refresh token revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid bearer token
  /auth/verify:
    post:
      operationId: verifyEmail
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Email verified; returns a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired token
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Always returns 200 (even if the account does not exist). If it
            does, a reset credential is emailed — never returned in the
            response.
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "200":
          description: Password updated
        "400":
          description: Invalid or expired token
  /classes:
    get:
      operationId: listClasses
      tags:
        - classes
      summary: List Classes owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
    post:
      operationId: createClass
      tags:
        - classes
      summary: Create a Class owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
  /classes/{classId}:
    get:
      operationId: getClass
      tags:
        - classes
      summary: Get a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          description: Not found
    put:
      operationId: updateClass
      tags:
        - classes
      summary: Update a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          description: Not found
    delete:
      operationId: deleteClass
      tags:
        - classes
      summary: Delete a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /classes/{classId}/subjects:
    get:
      operationId: listClassSubjects
      tags:
        - classes
      summary: List Subjects selected for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "404":
          description: Not found
    post:
      operationId: addClassSubject
      tags:
        - classes
      summary: Select a Subject for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClassSubjectRequest"
      responses:
        "201":
          description: Selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "404":
          description: Not found
  /classes/{classId}/subjects/{subjectId}:
    delete:
      operationId: removeClassSubject
      tags:
        - classes
      summary: Remove a Subject selection from a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
  /answers/{answerId}/evaluation-attempts:
    post:
      operationId: createEvaluationAttempt
      tags:
        - evaluations
      summary: "Trigger an Evaluation Attempt for an Answer -- one try at having the
        AI grade it (see CONTEXT.md — Evaluation Attempt). Defaults to `scoring`
        Purpose; pass `experiment` for offline comparison runs that never affect
        Effective Marks or Feedback. Runs synchronously for this issue's scope:
        the response reflects the Attempt's terminal status (`succeeded` or
        `failed`)."
      security:
        - bearerAuth: []
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationAttemptRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationAttempt"
        "404":
          description: Answer not found
    get:
      operationId: listEvaluationAttempts
      tags:
        - evaluations
      summary: List Evaluation Attempts for an Answer, most recent first
      security:
        - bearerAuth: []
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationAttemptList"
        "404":
          description: Answer not found
  /answers/{answerId}/evaluation-attempts/{attemptId}:
    get:
      operationId: getEvaluationAttempt
      tags:
        - evaluations
      summary: Poll/read a single Evaluation Attempt, including its Evaluation (score,
        marks, feedback) if it succeeded.
      security:
        - bearerAuth: []
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationAttempt"
        "404":
          description: Not found
  /classes/{classId}/exams:
    get:
      operationId: listExams
      tags:
        - exams
      summary: List Exams for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createExam
      tags:
        - exams
      summary: Create an Exam for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /classes/{classId}/exams/{examId}:
    get:
      operationId: getExam
      tags:
        - exams
      summary: Get an Exam in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "404":
          $ref: "#/components/responses/NotFound"
  /exams/{examId}/subjects:
    get:
      operationId: listExamSubjects
      tags:
        - exams
      summary: List Exam Subjects attached to an Exam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSubjectList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addExamSubject
      tags:
        - exams
      summary: Attach a Subject to an Exam (creates its Exam Subject)
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExamSubjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSubject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      tags:
        - health_other
  /exam-subjects/{examSubjectId}/questions:
    get:
      operationId: listQuestions
      tags:
        - questions
      summary: List Questions in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createQuestion
      tags:
        - questions
      summary: Author a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /exam-subjects/{examSubjectId}/questions/{questionId}:
    get:
      operationId: getQuestion
      tags:
        - questions
      summary: Get a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateQuestion
      tags:
        - questions
      summary: Update a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuestion
      tags:
        - questions
      summary: Remove a Question from an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /classes/{classId}/students:
    get:
      operationId: listStudents
      tags:
        - students
      summary: List Students in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentList"
        "404":
          description: Class not found
    post:
      operationId: createStudent
      tags:
        - students
      summary: Add a Student to a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Class not found
        "409":
          description: Roll Number already used in this Class
  /classes/{classId}/students/{studentId}:
    get:
      operationId: getStudent
      tags:
        - students
      summary: Get a Student in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    put:
      operationId: updateStudent
      tags:
        - students
      summary: Update a Student in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
        "409":
          description: Roll Number already used in this Class
    delete:
      operationId: deleteStudent
      tags:
        - students
      summary: Remove a Student from a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /subjects:
    get:
      operationId: listSubjects
      tags:
        - subjects
      summary: List the global Subject catalogue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
  /exam-subjects/{examSubjectId}/submissions:bulk-upload:
    post:
      operationId: bulkUploadSubmissions
      tags:
        - submissions
      summary: "Upload all Students' Answers for all Questions in an Exam Subject in
        one call. Teacher-driven, not student self-serve (see CONTEXT.md —
        Submission). Re-uploading is idempotent: an existing Submission for the
        same Student is reused, and an existing Answer for the same Question is
        overwritten."
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUploadSubmissionsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /exam-subjects/{examSubjectId}/submissions:
    get:
      operationId: listSubmissions
      tags:
        - submissions
      summary: List Submissions for an Exam Subject
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionList"
        "404":
          $ref: "#/components/responses/NotFound"
  /submissions/{submissionId}/answers:
    get:
      operationId: listAnswers
      tags:
        - submissions
      summary: List Answers belonging to a Submission
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerList"
        "404":
          $ref: "#/components/responses/NotFound"
  /submissions/{submissionId}/answers/{answerId}:
    get:
      operationId: getAnswer
      tags:
        - submissions
      summary: Get a single Answer
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAnswer
      tags:
        - submissions
      summary: Edit an Answer -- a teacher correcting a mis-entered Answer after bulk
        upload.
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnswerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required:
        - token
        - refresh_token
        - user
      properties:
        token:
          type: string
          description: Short-lived access token (JWT).
        refresh_token:
          type: string
          description: Long-lived, revocable refresh token. Rotated on each use.
        user:
          $ref: "#/components/schemas/User"
    SignupResponse:
      type: object
      required:
        - user
        - verification_token
      properties:
        user:
          $ref: "#/components/schemas/User"
        verification_token:
          type: string
          description: Short-lived token identifying the just-created (unverified)
            account. Submit it with the emailed OTP to POST /auth/verify to
            obtain a session. No access/refresh token is issued until the email
            is verified.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters with an uppercase letter, a lowercase letter, a
            digit, and a symbol; no leading or trailing whitespace.
        name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    VerifyRequest:
      type: object
      required:
        - verification_token
        - code
      properties:
        verification_token:
          type: string
          description: Short-lived token returned by /auth/signup; scopes the OTP
            submission.
        code:
          type: string
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirm:
      type: object
      required:
        - email
        - code
        - password
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters with an uppercase letter, a lowercase letter, a
            digit, and a symbol; no leading or trailing whitespace.
    Class:
      type: object
      required:
        - id
        - name
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    ClassList:
      type: object
      required:
        - classes
      properties:
        classes:
          type: array
          items:
            $ref: "#/components/schemas/Class"
    CreateClassRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    UpdateClassRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Subject:
      type: object
      required:
        - id
        - name
      properties:
