            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist, or is not visible to the authenticated
        User. Ownership failures are reported as 404, never 403, so the
        existence of another User's data is never disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing data (a uniqueness constraint,
        or dependent data that must be removed first — nothing cascades).
      content:
