openapi: 3.0.3
info:
  title: Worksheet Checker API
  version: 0.1.0
tags:
  - name: auth
    x-displayName: auth
  - name: classes
    x-displayName: classes
  - name: exams
    x-displayName: exams
  - name: health_other
    x-displayName: other
  - name: questions
    x-displayName: questions
  - name: students
    x-displayName: students
  - name: subjects
    x-displayName: subjects
paths:
  /auth/signup:
    post:
      operationId: signup
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access + refresh pair (old refresh token revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid bearer token
  /auth/verify:
    post:
      operationId: verifyEmail
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Email verified; returns a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired token
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Always returns 200 (even if the account does not exist). If it
            does, a reset credential is emailed — never returned in the
            response.
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "200":
          description: Password updated
        "400":
          description: Invalid or expired token
  /classes:
    get:
      operationId: listClasses
      tags:
        - classes
      summary: List Classes owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
    post:
      operationId: createClass
      tags:
        - classes
      summary: Create a Class owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /classes/{classId}:
    get:
      operationId: getClass
      tags:
        - classes
      summary: Get a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateClass
      tags:
        - classes
      summary: Update a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteClass
      tags:
        - classes
      summary: Delete a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /classes/{classId}/subjects:
    get:
      operationId: listClassSubjects
      tags:
        - classes
      summary: List Subjects selected for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "404":
          $ref: "#/components/responses/NotFound"
  /classes/{classId}/subjects:bulk-select:
    post:
      operationId: bulkSelectClassSubjects
      tags:
        - classes
      summary: Select Subjects for a Class
      description: "The primary path for choosing a Class's Subjects: submit the whole
        selection at once. Additive and idempotent — Subjects already selected
        are left alone, never duplicated or errored on. Deselecting is done with
        DELETE /classes/{classId}/subjects/{subjectId}. Every id must name a
        Subject in the caller's own catalogue; otherwise the whole request 404s
        and nothing is selected."
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSelectClassSubjectsRequest"
      responses:
        "201":
          description: The Class's Subject selection after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /classes/{classId}/subjects/{subjectId}:
    delete:
      operationId: removeClassSubject
      tags:
        - classes
      summary: Remove a Subject selection from a Class
      description: Never cascades. Once downstream Exam Subject / Question / Answer
        data exists, removing a selection that has such data underneath will
        return 409; no such table exists yet, so today the operation cannot
        conflict and 409 is deliberately not declared here.
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
  /classes/{classId}/exams:
    get:
      operationId: listExams
      tags:
        - exams
      summary: List Exams for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamList"
        "404":
          description: Class not found
    post:
      operationId: createExam
      tags:
        - exams
      summary: Create an Exam for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "404":
          description: Class not found
  /classes/{classId}/exams/{examId}:
    get:
      operationId: getExam
      tags:
        - exams
      summary: Get an Exam in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "404":
          description: Not found
  /exams/{examId}/subjects:
    get:
      operationId: listExamSubjects
      tags:
        - exams
      summary: List Exam Subjects attached to an Exam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSubjectList"
        "404":
          description: Exam not found
    post:
      operationId: addExamSubject
      tags:
        - exams
      summary: Attach a Subject to an Exam (creates its Exam Subject)
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExamSubjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSubject"
        "404":
          description: Exam or Subject not found
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      tags:
        - health_other
  /exam-subjects/{examSubjectId}/questions:
    get:
      operationId: listQuestions
      tags:
        - questions
      summary: List Questions in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
        "404":
          description: Exam Subject not found
    post:
      operationId: createQuestion
      tags:
        - questions
      summary: Author a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          description: Invalid type-specific config
        "404":
          description: Exam Subject not found
  /exam-subjects/{examSubjectId}/questions/{questionId}:
    get:
      operationId: getQuestion
      tags:
        - questions
      summary: Get a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "404":
          description: Not found
    put:
      operationId: updateQuestion
      tags:
        - questions
      summary: Update a Question in an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          description: Invalid type-specific config
        "404":
          description: Not found
    delete:
      operationId: deleteQuestion
      tags:
        - questions
      summary: Remove a Question from an Exam Subject's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: examSubjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /classes/{classId}/students:
    get:
      operationId: listStudents
      tags:
        - students
      summary: List Students in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStudent
      tags:
        - students
      summary: Add a Student to a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /classes/{classId}/students:bulk-upload:
    post:
      operationId: bulkUploadStudents
      tags:
        - students
      summary: Add several Students to a Class in one request
      description: "Submits a whole roster at once. All-or-nothing: if any entry is
        invalid or its Roll Number collides with an existing Student (or another
        entry in the same request), no Student is created. The response is the
        Class's full roster after the upload."
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUploadStudentsRequest"
      responses:
        "201":
          description: The Class's roster after the upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /classes/{classId}/students/{studentId}:
    get:
      operationId: getStudent
      tags:
        - students
      summary: Get a Student in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateStudent
      tags:
        - students
      summary: Update a Student in a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteStudent
      tags:
        - students
      summary: Remove a Student from a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /subjects:
    get:
      operationId: listSubjects
      tags:
        - subjects
      summary: List the authenticated User's Subject catalogue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
    post:
      operationId: createSubject
      tags:
        - subjects
      summary: Add a Subject to the authenticated User's catalogue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /subjects:bulk-create:
    post:
      operationId: bulkCreateSubjects
      tags:
        - subjects
      summary: Add several Subjects to the authenticated User's catalogue
      description: "Idempotent by name: names the User already has are skipped rather
        than rejected, so re-submitting the same list never errors. The response
        is the User's full catalogue after the operation."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateSubjectsRequest"
      responses:
        "201":
          description: The User's catalogue after the requested names were added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /subjects/{subjectId}:
    put:
      operationId: updateSubject
      tags:
        - subjects
      summary: Rename a Subject in the authenticated User's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSubject
      tags:
        - subjects
      summary: Remove a Subject from the authenticated User's catalogue
      description: Never cascades. A Subject still selected by any Class (or
        referenced by downstream Exam Subject / Question / Answer data) returns
        409; remove those references first.
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  schemas:
    Error:
      type: object
      required:
        - msg
      properties:
        msg:
          type: string
          description: Human-readable error message.
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required:
        - token
        - refresh_token
        - user
      properties:
        token:
          type: string
          description: Short-lived access token (JWT).
        refresh_token:
          type: string
          description: Long-lived, revocable refresh token. Rotated on each use.
        user:
          $ref: "#/components/schemas/User"
    SignupResponse:
      type: object
      required:
        - user
        - verification_token
      properties:
        user:
          $ref: "#/components/schemas/User"
        verification_token:
          type: string
          description: Short-lived token identifying the just-created (unverified)
            account. Submit it with the emailed OTP to POST /auth/verify to
            obtain a session. No access/refresh token is issued until the email
            is verified.
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters with an uppercase letter, a lowercase letter, a
            digit, and a symbol; no leading or trailing whitespace.
        name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    VerifyRequest:
      type: object
      required:
        - verification_token
        - code
      properties:
        verification_token:
          type: string
          description: Short-lived token returned by /auth/signup; scopes the OTP
            submission.
        code:
          type: string
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
