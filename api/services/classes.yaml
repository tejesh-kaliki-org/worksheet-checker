openapi: 3.0.3
info:
  title: Worksheet Checker — classes
  version: 0.1.0
paths:
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List Classes owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a Class owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
        "409":
          $ref: "./shared.yaml#/components/responses/Conflict"
  /classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
    put:
      operationId: updateClass
      tags: [classes]
      summary: Update a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
        "409":
          $ref: "./shared.yaml#/components/responses/Conflict"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a Class owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
  /classes/{classId}/subjects:
    get:
      operationId: listClassSubjects
      tags: [classes]
      summary: List Subjects selected for a Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
  /classes/{classId}/subjects:bulk-select:
    post:
      operationId: bulkSelectClassSubjects
      tags: [classes]
      summary: Select Subjects for a Class
      description: >-
        The primary path for choosing a Class's Subjects: submit the whole
        selection at once. Additive and idempotent — Subjects already selected
        are left alone, never duplicated or errored on. Deselecting is done
        with DELETE /classes/{classId}/subjects/{subjectId}. Every id must
        name a Subject in the caller's own catalogue; otherwise the whole
        request 404s and nothing is selected.
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSelectClassSubjectsRequest"
      responses:
        "201":
          description: The Class's Subject selection after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
  /classes/{classId}/subjects/{subjectId}:
    delete:
      operationId: removeClassSubject
      tags: [classes]
      summary: Remove a Subject selection from a Class
      description: >-
        Never cascades. Once downstream Exam Subject / Question / Answer data
        exists, removing a selection that has such data underneath will return
        409; no such table exists yet, so today the operation cannot conflict
        and 409 is deliberately not declared here.
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Class:
      type: object
      required: [id, name, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    ClassList:
      type: object
      required: [classes]
      properties:
        classes:
          type: array
          items:
            $ref: "#/components/schemas/Class"
    CreateClassRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    UpdateClassRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Subject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SubjectList:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
    BulkSelectClassSubjectsRequest:
      type: object
      required: [subject_ids]
      properties:
        subject_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
