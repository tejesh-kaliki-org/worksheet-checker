openapi: 3.0.3
info:
  title: Worksheet Checker — subjects
  version: 0.1.0
paths:
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List the global Subject catalogue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Subject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SubjectList:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
