openapi: 3.0.3
info:
  title: Worksheet Checker — subjects
  version: 0.1.0
paths:
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List the authenticated User's Subject catalogue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Add a Subject to the authenticated User's catalogue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
        "409":
          $ref: "./shared.yaml#/components/responses/Conflict"
  /subjects:bulk-create:
    post:
      operationId: bulkCreateSubjects
      tags: [subjects]
      summary: Add several Subjects to the authenticated User's catalogue
      description: >-
        Idempotent by name: names the User already has are skipped rather than
        rejected, so re-submitting the same list never errors. The response is
        the User's full catalogue after the operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateSubjectsRequest"
      responses:
        "201":
          description: The User's catalogue after the requested names were added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
  /subjects/{subjectId}:
    put:
      operationId: updateSubject
      tags: [subjects]
      summary: Rename a Subject in the authenticated User's catalogue
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "./shared.yaml#/components/responses/BadRequest"
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
        "409":
          $ref: "./shared.yaml#/components/responses/Conflict"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Remove a Subject from the authenticated User's catalogue
      description: >-
        Never cascades. A Subject still selected by any Class (or referenced by
        downstream Exam Subject / Question / Answer data) returns 409; remove
        those references first.
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "./shared.yaml#/components/responses/NotFound"
        "409":
          $ref: "./shared.yaml#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Subject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SubjectList:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
    CreateSubjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    UpdateSubjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    BulkCreateSubjectsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
