# Dependencies only — postgres, mailpit.
#
# Use this to run the backend on your host (go run ./cmd/server) against
# containerized dependencies, instead of building the backend image:
#
#   docker compose -f docker-compose.services.yml up -d
#   cd backend && go run ./cmd/server
#
# Ports map to the backend's local config defaults (config/env.yaml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-worksheet_checker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-worksheet_checker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit captures all outgoing mail locally. Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
